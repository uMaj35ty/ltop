name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # glibc 基线:22.04(2.35)。实测 0.1.1 在 ubuntu-24.04(glibc 2.39)上
    # 构建的二进制于 22.04 因 GLIBC_2.39 weak 缺失不可用——基线取矩阵最老 glibc
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      # eBPF 对象在 build.rs 里由 clang(-target bpf)编译;22.04 的 clang 带 bpf 后端
      - name: Install toolchain
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y clang curl git gh
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --release
      # 开箱别名:loli → ltop 软链进压缩包,-h 按调用名显示
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/ltop target/release/ltop-bpf dist/
          ln -s ltop dist/loli
          tar czf "ltop-${GITHUB_REF_NAME#v}-x86_64-linux.tar.gz" -C dist ltop ltop-bpf loli
          sha256sum "ltop-${GITHUB_REF_NAME#v}-x86_64-linux.tar.gz" > SHA256SUMS
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 幂等:重推已有 tag 时不炸,资产 --clobber 覆盖
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "ltop-${GITHUB_REF_NAME#v}-x86_64-linux.tar.gz" SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "ltop-${GITHUB_REF_NAME#v}-x86_64-linux.tar.gz" SHA256SUMS \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
