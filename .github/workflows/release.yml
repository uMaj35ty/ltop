name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # glibc 基线:22.04(2.35)。实测 0.1.1 在 ubuntu-24.04(glibc 2.39)上
    # 构建的二进制于 22.04 因 GLIBC_2.39 weak 缺失不可用——基线取矩阵最老 glibc
    container:
      image: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            slug: x86_64-linux
            cross: ""
          - target: aarch64-unknown-linux-gnu
            slug: aarch64-linux
            cross: aarch64-linux-gnu-
    steps:
      - uses: actions/checkout@v7
      # eBPF 对象在 build.rs 里由 clang(-target bpf)编译;22.04 的 clang 带 bpf
      # 后端,且按 CARGO_CFG_TARGET_ARCH 传 -D__TARGET_ARCH_* 分支寄存器布局
      - name: Install toolchain
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y clang curl git gh \
            gcc-aarch64-linux-gnu
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ltop" \
             "target/${{ matrix.target }}/release/ltop-bpf" dist/
          ln -s ltop dist/loli
          tar czf "ltop-${GITHUB_REF_NAME#v}-${{ matrix.slug }}.tar.gz" -C dist ltop ltop-bpf loli
          sha256sum "ltop-${GITHUB_REF_NAME#v}-${{ matrix.slug }}.tar.gz" > "SHA256SUMS-${{ matrix.slug }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.slug }}
          path: |
            ltop-*-${{ matrix.slug }}.tar.gz
            SHA256SUMS-${{ matrix.slug }}

  # mac 双架构:arm64 原生 + x86_64 交叉(Apple SDK 同机可编);无 ltop-bpf
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            slug: aarch64-darwin
          - target: x86_64-apple-darwin
            slug: x86_64-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ltop" dist/
          ln -s ltop dist/loli
          tar czf "ltop-${GITHUB_REF_NAME#v}-${{ matrix.slug }}.tar.gz" -C dist ltop loli
          shasum -a 256 "ltop-${GITHUB_REF_NAME#v}-${{ matrix.slug }}.tar.gz" > "SHA256SUMS-${{ matrix.slug }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.slug }}
          path: |
            ltop-*-${{ matrix.slug }}.tar.gz
            SHA256SUMS-${{ matrix.slug }}

  release:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Merge SHA256SUMS
        run: cat SHA256SUMS-* > SHA256SUMS
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 幂等:重推已有 tag 时不炸,资产 --clobber 覆盖
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ltop-*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" ltop-*.tar.gz SHA256SUMS \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
