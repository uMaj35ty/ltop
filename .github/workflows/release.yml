name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # glibc 基线:22.04(2.35)。实测 0.1.1 在 ubuntu-24.04(glibc 2.39)上
    # 构建的二进制于 22.04 因 GLIBC_2.39 weak 缺失不可用——基线取矩阵最老 glibc
    container:
      image: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            slug: x86_64-linux
            cross: ""
          - target: aarch64-unknown-linux-gnu
            slug: aarch64-linux
            cross: aarch64-linux-gnu-
    steps:
      - uses: actions/checkout@v7
      # eBPF 对象在 build.rs 里由 clang(-target bpf)编译;22.04 的 clang 带 bpf
      # 后端,且按 CARGO_CFG_TARGET_ARCH 传 -D__TARGET_ARCH_* 分支寄存器布局
      - name: Install toolchain
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y clang curl git gh \
            gcc-aarch64-linux-gnu
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ltop" \
             "target/${{ matrix.target }}/release/ltop-bpf" dist/
          tar czf "ltop-${GITHUB_REF_NAME#v}-${{ matrix.slug }}.tar.gz" -C dist ltop ltop-bpf
          sha256sum "ltop-${GITHUB_REF_NAME#v}-${{ matrix.slug }}.tar.gz" > "SHA256SUMS-${{ matrix.slug }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.slug }}
          path: |
            ltop-*-${{ matrix.slug }}.tar.gz
            SHA256SUMS-${{ matrix.slug }}

  # mac 双架构:arm64 原生 + x86_64 交叉(Apple SDK 同机可编);无 ltop-bpf
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            slug: aarch64-darwin
          - target: x86_64-apple-darwin
            slug: x86_64-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ltop" dist/
          tar czf "ltop-${GITHUB_REF_NAME#v}-${{ matrix.slug }}.tar.gz" -C dist ltop
          shasum -a 256 "ltop-${GITHUB_REF_NAME#v}-${{ matrix.slug }}.tar.gz" > "SHA256SUMS-${{ matrix.slug }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.slug }}
          path: |
            ltop-*-${{ matrix.slug }}.tar.gz
            SHA256SUMS-${{ matrix.slug }}

  # 发版后自动刷新 homebrew tap(uMaj35ty/homebrew-ltop);TAP_TOKEN =
  # fine-grained PAT(contents:write @ homebrew-ltop),仓库 Settings→Secrets 配置
  update-tap:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Generate formula and push tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          SHA_M_ARM=$(sha256sum "ltop-${VER}-aarch64-darwin.tar.gz" | cut -d' ' -f1)
          SHA_M_X86=$(sha256sum "ltop-${VER}-x86_64-darwin.tar.gz" | cut -d' ' -f1)
          SHA_L_ARM=$(sha256sum "ltop-${VER}-aarch64-linux.tar.gz" | cut -d' ' -f1)
          SHA_L_X86=$(sha256sum "ltop-${VER}-x86_64-linux.tar.gz" | cut -d' ' -f1)
          mkdir -p Formula
          sed -e "s@__VER__@${VER}@g" -e "s@__TAG__@${TAG}@g" \
              -e "s@__SHA_M_ARM__@${SHA_M_ARM}@" -e "s@__SHA_M_X86__@${SHA_M_X86}@" \
              -e "s@__SHA_L_ARM__@${SHA_L_ARM}@" -e "s@__SHA_L_X86__@${SHA_L_X86}@" \
              > Formula/ltop.rb <<'RUBY'
          class Ltop < Formula
            desc "btop-styled TUI monitor for local network traffic, LAN neighbours and disk I/O"
            homepage "https://github.com/uMaj35ty/ltop"
            version "__VER__"

            on_macos do
              on_arm do
                url "https://github.com/uMaj35ty/ltop/releases/download/__TAG__/ltop-__VER__-aarch64-darwin.tar.gz"
                sha256 "__SHA_M_ARM__"
              end
              on_intel do
                url "https://github.com/uMaj35ty/ltop/releases/download/__TAG__/ltop-__VER__-x86_64-darwin.tar.gz"
                sha256 "__SHA_M_X86__"
              end
            end
            on_linux do
              on_arm do
                url "https://github.com/uMaj35ty/ltop/releases/download/__TAG__/ltop-__VER__-aarch64-linux.tar.gz"
                sha256 "__SHA_L_ARM__"
              end
              on_intel do
                url "https://github.com/uMaj35ty/ltop/releases/download/__TAG__/ltop-__VER__-x86_64-linux.tar.gz"
                sha256 "__SHA_L_X86__"
              end
            end

            def install
              bin.install "ltop"
              on_linux do
                bin.install "ltop-bpf"
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ltop --version")
            end
          end
          RUBY
          git config --global user.name "ltop-release-bot"
          git config --global user.email "actions@users.noreply.github.com"
          set -x
          # 远端有历史:init 后 fetch 并软重置到远端头(避免孤立 root commit
          # 被拒 non-fast-forward、add/add 冲突),再提交 formula 差异;空仓
          # fetch 失败则作为首个提交推送
          mkdir taprepo && cd taprepo
          git init -b main
          git remote add origin "https://x-access-token:${TAP_TOKEN}@github.com/uMaj35ty/homebrew-ltop.git"
          if git fetch origin main 2>/dev/null; then
            git reset --soft FETCH_HEAD
            git reset FETCH_HEAD
          else
            echo "remote empty or unreachable"
          fi
          mkdir -p Formula
          cp ../Formula/ltop.rb Formula/
          git add Formula/ltop.rb
          git commit -m "ltop ${VER}" || echo "formula unchanged"
          git push -u origin main
          ls -la Formula/

  release:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Merge SHA256SUMS
        run: cat SHA256SUMS-* > SHA256SUMS
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 幂等:重推已有 tag 时不炸,资产 --clobber 覆盖
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ltop-*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" ltop-*.tar.gz SHA256SUMS \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
