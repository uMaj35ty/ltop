<section>
  <div class="wrap">
    <div class="gal">
      <figure>
        <a href="assets/screenshots/main.webp"><div class="frame">
          <img loading="lazy" src="assets/screenshots/main.webp" alt="Classic 布局，Steam 下载进行中">
        </div></a>
        <h3>Classic 布局实况——<code>Tab</code> 循环 #1</h3>
        <p>Steam 下载进行中：NET 图表爬升（RX 8.8MiB/s）、LAN 邻居在线、CONNS 按进程折叠
        （steam ×50，组 Σ 高亮）、PROCS 每进程整场网络+磁盘列、DISKS 设备树带容量条。</p>
      </figure>

      <figure>
        <a href="assets/screenshots/wide-conns-detail.webp"><div class="frame">
          <img loading="lazy" src="assets/screenshots/wide-conns-detail.webp" alt="Wide 布局：连接详情面板">
        </div></a>
        <h3>Wide 布局，连接详情——任意行上 <code>enter</code></h3>
        <p>firefox 的一条连接开在详情面板：协议与状态、本地/远端端点、inode、流量 Σ 与速率。
        面板内：<code>space</code>/<code>t</code> 追踪置顶，<code>y</code> 复制任意字段
        （OSC 52——ssh 下也直达本地剪贴板），<code>k</code> 终止。下方退出的进程灰显保留
        （标 <code>(gone)</code>），总量还在。</p>
      </figure>

      <figure>
        <a href="assets/screenshots/tall-procs-detail.webp"><div class="frame">
          <img loading="lazy" src="assets/screenshots/tall-procs-detail.webp" alt="Tall 布局：进程详情面板与捕获的完整命令行">
        </div></a>
        <h3>Tall 布局，进程详情+复制——<code>Tab</code> 循环 #3</h3>
        <p>steamwebhelper 开在详情面板：uid、内核状态、线程数、RSS、exe/cwd——完整捕获的命令行，
        选中段高亮可 <code>y</code> 复制；下方 traffic/disk 分组，整盒在 tall 布局上放大。</p>
      </figure>

      <figure>
        <a href="assets/screenshots/conns-zoom-search.webp"><div class="frame">
          <img loading="lazy" src="assets/screenshots/conns-zoom-search.webp" alt="CONNS 盒全屏缩放，带 steam 搜索过滤">
        </div></a>
        <h3>缩放+搜索——<code>z</code> 与 <code>/</code></h3>
        <p>CONNS 全屏缩放（<code>z</code>）加实时搜索（<code>/ steam</code>，页脚显示当前过滤）：
        107 条连接折成进程组——steam ×24、steamwebhelper ×11、steam ×69——组头各带 Σ，UDP 行有
        标签且由 eBPF 助手计量。</p>
      </figure>

      <figure>
        <a href="assets/screenshots/detail-copy-fields.webp"><div class="frame">
          <img loading="lazy" src="assets/screenshots/detail-copy-fields.webp" alt="进程详情面板：分组字段与剪贴板复制">
        </div></a>
        <h3>详情字段，分组可复制——<code>↑↓</code> 与 <code>y</code></h3>
        <p>详情面板把进程的身份、流量、磁盘数字分组；<code>↑↓</code> 移动字段光标，
        <code>y</code> 把选中值复制到剪贴板（OSC 52，不依赖 X11）。主题菜单
        （<code>m</code>）在后面候着。</p>
      </figure>

      <figure>
        <a href="assets/screenshots/classic-six-boxes.webp"><div class="frame">
          <img loading="lazy" src="assets/screenshots/classic-six-boxes.webp" alt="Classic 布局——全宽桌面上的六盒总览">
        </div></a>
        <h3>Classic 全宽——六盒总览</h3>
        <p>早期全宽截图：盲文吞吐图表、带流量的 LAN 邻居、按组 Σ 折叠的连接、每进程会话账本、磁盘树。</p>
      </figure>

      <figure>
        <a href="assets/screenshots/wide-detail-panel.webp"><div class="frame">
          <img loading="lazy" src="assets/screenshots/wide-detail-panel.webp" alt="Wide 布局：进程详情面板">
        </div></a>
        <h3>Wide 布局，进程详情——<code>Tab</code> 循环 #2</h3>
        <p>图表横贯上方、表格在下——进程开在详情面板，带完整命令行、逐连接 UDP 分解，主题菜单在背后。</p>
      </figure>

      <figure>
        <a href="assets/screenshots/tall-process-groups.webp"><div class="frame">
          <img loading="lazy" src="assets/screenshots/tall-process-groups.webp" alt="Tall 布局：分组连接与被追踪行">
        </div></a>
        <h3>Tall 布局，连接分组</h3>
        <p>窄终端的单列布局：CONNS 按进程分组排序、组头带总量、黄色被追踪行跨重排不丢。</p>
      </figure>

      <figure>
        <a href="assets/screenshots/omarchy-theme-follow.gif"><div class="frame">
          <img loading="lazy" src="assets/screenshots/omarchy-theme-follow.gif" alt="动画：桌面切换 Omarchy 主题时 ltop 实时变色">
        </div></a>
        <h3>主题跟随桌面——<code>--follow-theme</code></h3>
        <p>Sakura → Tokyo Night → Gruvbox → Hackerman → Sakura，全程实时：加
        <code>--follow-theme</code> 后 Omarchy 桌面切主题，运行中的 ltop 跟着变色，无需重启。
        任何 btop 主题文件也可直接加载：<code>ltop --theme ~/my.theme</code>。</p>
      </figure>
