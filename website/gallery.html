<section class="gal-hero">
  <div class="wrap">
    <h1><span style="color:var(--green)">Gallery</span></h1>
    <p class="lead">Real captures, no mockups — click any shot for the full-size image.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="gal">
      <figure>
        <a href="assets/screenshots/main.png"><div class="frame">
          <img loading="lazy" src="assets/screenshots/main.png" alt="Classic layout mid Steam download">
        </div></a>
        <h3>Classic layout, live — <code>Tab</code> cycle #1</h3>
        <p>A Steam download in progress: NET charts climbing (RX 8.8MiB/s), LAN neighbours online,
        CONNS folded per process (steam ×50, group Σ highlighted), PROCS with session-cumulative
        network + disk columns, and the DISKS device tree with capacity bars.</p>
      </figure>

      <figure>
        <a href="assets/screenshots/wide-conns-detail.png"><div class="frame">
          <img loading="lazy" src="assets/screenshots/wide-conns-detail.png" alt="Wide layout with a connection detail panel">
        </div></a>
        <h3>Wide layout, connection detail — <code>enter</code> on any row</h3>
        <p>A firefox connection open in the detail panel: protocol and state, local/remote endpoints,
        inode, traffic Σ and rates. Inside the panel: <code>space</code>/<code>t</code> track-pins the
        row, <code>y</code> copies any field (OSC 52 — works over SSH), <code>k</code> kills. Exited
        processes keep their totals below (grayed, marked <code>(gone)</code>).</p>
      </figure>

      <figure>
        <a href="assets/screenshots/tall-procs-detail.png"><div class="frame">
          <img loading="lazy" src="assets/screenshots/tall-procs-detail.png" alt="Tall layout with a process detail panel and the captured command line">
        </div></a>
        <h3>Tall layout, process detail + copy — <code>Tab</code> cycle #3</h3>
        <p>steamwebhelper open in the detail panel: uid, kernel state, threads, RSS, exe/cwd — and the
        full captured command line with the selected segment highlighted for <code>y</code>. Traffic and
        disk break-down below, the whole box zoomed over the tall layout.</p>
      </figure>

      <figure>
        <a href="assets/screenshots/conns-zoom-search.png"><div class="frame">
          <img loading="lazy" src="assets/screenshots/conns-zoom-search.png" alt="CONNS box zoomed full-screen with a steam search filter applied">
        </div></a>
        <h3>Zoom + search — <code>z</code> and <code>/</code></h3>
        <p>CONNS zoomed full-screen (<code>z</code>) with a live search (<code>/ steam</code>, footer
        shows the active filter): 107 connections folded into process groups — steam ×24, steamwebhelper
        ×11, steam ×69 — each group head carrying its Σ, UDP rows tagged and metered by the eBPF helper.</p>
      </figure>

      <figure>
        <a href="assets/screenshots/detail-copy-fields.png"><div class="frame">
          <img loading="lazy" src="assets/screenshots/detail-copy-fields.png" alt="Process detail panel with grouped fields and clipboard copy">
        </div></a>
        <h3>Detail fields, grouped &amp; copyable — <code>↑↓</code> and <code>y</code></h3>
        <p>The detail panel groups a process's identity, traffic and disk numbers; <code>↑↓</code> moves
        a field cursor and <code>y</code> copies the selected value to the clipboard (OSC 52, no X11
        dependency). The theme menu (<code>m</code>) waits behind it.</p>
      </figure>

      <figure>
        <a href="assets/screenshots/classic-six-boxes.png"><div class="frame">
          <img loading="lazy" src="assets/screenshots/classic-six-boxes.png" alt="Classic layout — all six boxes on a full-width desktop">
        </div></a>
        <h3>Classic, full width — the six-box overview</h3>
        <p>Earlier full-width capture: braille throughput charts, LAN neighbours with per-peer traffic,
        connections grouped with Σ totals, per-process session accounting, the disk tree.</p>
      </figure>

      <figure>
        <a href="assets/screenshots/wide-detail-panel.png"><div class="frame">
          <img loading="lazy" src="assets/screenshots/wide-detail-panel.png" alt="Wide layout with a process detail panel">
        </div></a>
        <h3>Wide layout, process detail — <code>Tab</code> cycle #2</h3>
        <p>Charts across the top, tables below — a process open in the detail panel with its full
        command line, per-connection UDP break-down and the theme menu behind.</p>
      </figure>

      <figure>
        <a href="assets/screenshots/tall-process-groups.png"><div class="frame">
          <img loading="lazy" src="assets/screenshots/tall-process-groups.png" alt="Tall layout with grouped connections and a tracked row">
        </div></a>
        <h3>Tall layout, grouped connections</h3>
        <p>Single column for narrow terminals: CONNS in proc-grouped sort, group heads with totals,
        a tracked row (yellow) surviving re-sorts.</p>
      </figure>

      <figure>
        <a href="assets/screenshots/omarchy-theme-follow.gif"><div class="frame">
          <img loading="lazy" src="assets/screenshots/omarchy-theme-follow.gif" alt="Animated: ltop re-coloring live as the Omarchy desktop theme changes">
        </div></a>
        <h3>Theme follows the desktop — <code>--follow-theme</code></h3>
        <p>Sakura → Tokyo Night → Gruvbox → Hackerman → Sakura, live: with <code>--follow-theme</code>
        a running ltop re-colors as the Omarchy desktop theme switches, no restart. Any btop theme
        file also loads as-is: <code>ltop --theme ~/my.theme</code>.</p>
      </figure>
    </div>
