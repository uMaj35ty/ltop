[package]
name = "ltop"
version = "0.2.0"
edition = "2021"
description = "btop-styled TUI monitoring only local network, LAN neighbours and disk I/O"
license = "MIT"
readme = "README.md"
repository = "https://github.com/uMaj35ty/ltop"
default-run = "ltop"
autobins = false

[[bin]]
name = "ltop"
path = "src/bin/ltop.rs"

[[bin]]
name = "ltop-bpf"
path = "src/bin/ltop_bpf.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
if-addrs = "0.15"
libc = "0.2"
ratatui = "0.30.2"

# aya/eBPF 加载器仅 Linux(ltop-bpf 二进制);mac 构建不引入
[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
aya-obj = "0.5"

[profile.release]
lto = true
strip = true
